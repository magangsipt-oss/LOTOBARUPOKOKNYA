# Laptop test overrides: https://localhost:8443, MySQL on 127.0.0.1:3308.
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
services:
  db:
    ports: !override
      - "127.0.0.1:3308:3306"
  backend:
    environment:
      FRONTEND_URL: https://localhost:8443
  web:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.local", "--adapter", "caddyfile"]
    ports: !override
      - "127.0.0.1:8443:443"
