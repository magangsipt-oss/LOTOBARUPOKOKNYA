name: Deploy E-LOTO to BiznetGIO

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      activate:
        description: "Restart backend after the VPS database schema is ready"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eloto-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 103.197.188.61
      DEPLOY_USER: admin123
      DEPLOY_ROOT: /srv/eloto

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build production frontend and release archive
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter frontend run build

          release_dir="$RUNNER_TEMP/eloto-release"
          mkdir -p "$release_dir"
          git archive --format=tar "$GITHUB_SHA" \
            backend frontend/package.json counting/package.json package.json \
            pnpm-lock.yaml pnpm-workspace.yaml ops/systemd/eloto-backend.service \
            | tar -xf - -C "$release_dir"
          mkdir -p "$release_dir/frontend/dist"
          cp -a frontend/dist/. "$release_dir/frontend/dist/"
          tar -czf "$RUNNER_TEMP/eloto-release.tar.gz" -C "$release_dir" .

      - name: Upload and activate release over pinned SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ACTIVATE: ${{ github.event_name == 'push' || inputs.activate }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Add Actions secret DEPLOY_SSH_KEY.' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Add Actions secret DEPLOY_KNOWN_HOSTS with the verified VPS host key.' >&2; exit 1; }

          key_file="$RUNNER_TEMP/eloto-deploy-key"
          known_hosts_file="$RUNNER_TEMP/eloto-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          ssh-keygen -F "[$DEPLOY_HOST]:22" -f "$known_hosts_file" >/dev/null || {
            echo 'DEPLOY_KNOWN_HOSTS must pin [103.197.188.61]:22.' >&2
            exit 1
          }

          ssh_opts=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$DEPLOY_ROOT/incoming' '$DEPLOY_ROOT/releases'"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/eloto-release.tar.gz" "$target:$DEPLOY_ROOT/incoming/$release_id.tar.gz"
          ssh "${ssh_opts[@]}" "$target" "bash -s -- '$release_id' '$DEPLOY_ROOT' '$DEPLOY_ACTIVATE'" < ops/deploy-vps.sh
