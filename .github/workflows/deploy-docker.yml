name: Deploy E-LOTO (Docker)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - compose.yaml
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eloto-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 103.139.192.146
      DEPLOY_USER: admin

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o "$RUNNER_TEMP/eloto-release.tar.gz" "$GITHUB_SHA" \
            backend frontend counting/package.json package.json pnpm-lock.yaml pnpm-workspace.yaml \
            docker compose.yaml .dockerignore

      # The server builds the images and restarts the stack (ops/deploy-docker.sh).
      - name: Deploy over pinned SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCKER_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Add Actions secret DOCKER_DEPLOY_SSH_KEY.' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Add Actions secret DOCKER_DEPLOY_KNOWN_HOSTS (verified host key).' >&2; exit 1; }
          key_file="$RUNNER_TEMP/eloto-deploy-key"
          known_hosts_file="$RUNNER_TEMP/eloto-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh-keygen -F "$DEPLOY_HOST" -f "$known_hosts_file" >/dev/null || {
            echo "DOCKER_DEPLOY_KNOWN_HOSTS must pin $DEPLOY_HOST." >&2
            exit 1
          }
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "${GITHUB_SHA}-${GITHUB_RUN_ID}" < "$RUNNER_TEMP/eloto-release.tar.gz"
